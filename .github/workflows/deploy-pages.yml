name: Deploy Fridge Chef to GitHub Pages

# Builds the PWA in app/ and publishes it to GitHub Pages, giving a permanent
# shareable link at https://<owner>.github.io/<repo>/ .
#
# One-time setup in the repo: Settings → Pages → "Build and deployment" →
# Source: "GitHub Actions". (Optional) add a repository variable BACKEND_URL
# pointing at your deployed Cloudflare Worker so AI detection works for everyone.

on:
  push:
    branches:
      - main
      - claude/fridge-recipe-app-VKvYD
    paths:
      - "app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        env:
          # Project Pages are served from /<repo>/ — keep this in sync with the repo name.
          VITE_BASE: "/${{ github.event.repository.name }}/"
          # Set a repository variable named BACKEND_URL to your Worker URL to enable AI detection.
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
